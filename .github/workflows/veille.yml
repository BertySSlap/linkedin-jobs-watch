name: veille-offres

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer l'intervalle normal, sans contourner une pause imposée par LinkedIn"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: veille-offres
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Charger le dernier code et l'état de main
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Vérification des offres
        env:
          COMPANY_ID: ${{ secrets.COMPANY_ID }}
          COMPANY_POSTS: ${{ secrets.COMPANY_POSTS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INTERVALLE_CONTROLE_MINUTES: '10'
          SEUIL_ALERTE_ECHECS: '6'
          FORCE_CHECK: ${{ inputs.force }}
        run: python3 checker.py

      - name: Sauvegarde de l'état
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git add etat.json
          if ! git diff --cached --quiet; then
            git config user.name "veille-bot"
            git config user.email "veille-bot@users.noreply.github.com"
            git commit -m "maj etat"
            for tentative in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$tentative" -eq 3 ]; then
                break
              fi

              etat_a_fusionner="$RUNNER_TEMP/etat-veille-local.json"
              cp etat.json "$etat_a_fusionner"
              git fetch origin main
              git reset --hard origin/main
              python3 fusionne_etat.py etat.json "$etat_a_fusionner"
              git add etat.json

              if git diff --cached --quiet; then
                exit 0
              fi

              git commit -m "maj etat (fusion)"
            done

            echo "Impossible de sauvegarder l'état après 3 tentatives."
            exit 1
          fi

